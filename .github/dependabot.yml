# Dependabot configuration
#
# Documentation:
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2

updates:

  #########################################################
  # GitHub Actions
  #########################################################
  - package-ecosystem: "github-actions"
    directory: "/"

    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "Europe/Warsaw"

    # Automatically group all GitHub Actions updates
    groups:
      github-actions:
        patterns:
          - "*"

    # Limit number of open PRs
    open-pull-requests-limit: 10

    # Add labels to PRs
    labels:
      - "dependencies"
      - "github-actions"

    # Use conventional commit style
    commit-message:
      prefix: "chore"
      include: "scope"

  #########################################################
  # Go Modules
  #########################################################
  - package-ecosystem: "gomod"
    directory: "/"

    schedule:
      interval: "daily"
      time: "06:30"
      timezone: "Europe/Warsaw"

    # Automatically group minor and patch updates
    groups:
      go-dependencies:
        patterns:
          - "*"

    # Limit number of open PRs
    open-pull-requests-limit: 10

    # Add labels to PRs
    labels:
      - "dependencies"
      - "golang"

    # Use conventional commit style
    commit-message:
      prefix: "chore"
      include: "scope"

    # Ignore unstable Go versions if needed
    ignore:
      - dependency-name: "go"
        update-types:
          - "version-update:semver-major"